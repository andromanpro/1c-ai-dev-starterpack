name: проверка-публикации
on: [push, pull_request]
jobs:
  validate:
    runs-on: windows-1c
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Самотест проверки (грязная фикстура обязана краснить)
        run: py -3.14 tools/validate.py --selftest
      - name: Проверка репозитория (публичный слой)
        run: py -3.14 tools/validate.py
